<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <img src="icons/icon128.png" class="header-logo" alt="MyDM Logo" />
      <div>
        <h2>MyDM Chrome Bridge</h2>
        <span class="version">Phiên bản 0.2</span>
      </div>
    </div>

    <!-- Diagnostics -->
    <div class="section">
      <h3>Chẩn đoán kết nối</h3>
      <button id="ping" class="btn-primary">Kiểm tra kết nối</button>
      <div id="diagnostics" class="diagnostics" style="display:none">
        <div class="diag-row">
          <span>Extension → Native host:</span>
          <span id="diag-host" class="diag-status">—</span>
        </div>
        <div class="diag-row">
          <span>Phiên bản giao thức:</span>
          <span id="diag-version">—</span>
        </div>
      </div>
    </div>

    <hr />

    <!-- Mode selection -->
    <div class="section">
      <h3>Chế độ nhận link</h3>
      <label class="radio-label">
        <input type="radio" name="mode" value="off" checked />
        <span><strong>Tắt</strong> — Chỉ tải bằng chuột phải</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="ask" />
        <span><strong>Hỏi trước</strong> — Ghi nhận tác vụ, bạn xác nhận trong MyDM</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="auto" />
        <span><strong>Tự chuyển</strong> — Tự động chuyển theo quy tắc bên dưới</span>
      </label>
    </div>

    <hr />

    <!-- Domain rules -->
    <div class="section">
      <h3>Quy tắc tên miền</h3>
      <label class="field-label">
        Website được phép (mỗi dòng một tên miền):
        <textarea id="allowDomains" placeholder="example.com&#10;cdn.example.com" rows="3"></textarea>
      </label>
      <label class="field-label">
        Website loại trừ:
        <textarea id="blockDomains" placeholder="accounts.google.com" rows="2"></textarea>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="allowSubdomains" />
        Áp dụng cho cả tên miền phụ (*.example.com)
      </label>
    </div>

    <hr />

    <!-- Session/Cookie settings -->
    <div class="section">
      <h3>Phiên đăng nhập Chrome</h3>
      <p class="help-text">
        Cho phép MyDM dùng phiên đăng nhập Chrome để tải file cần xác thực.
        Chỉ bật cho website bạn tin tưởng.
      </p>
      <label class="field-label">
        Website được cấp phiên (mỗi dòng một tên miền):
        <textarea id="sessionSites" placeholder="drive.google.com&#10;dropbox.com" rows="3"></textarea>
      </label>
      <button id="grantCookies" class="btn-secondary">Cấp quyền cookie</button>
      <button id="revokeCookies" class="btn-danger">Thu hồi quyền cookie</button>
      <p id="cookieStatus" class="status-text"></p>
    </div>

    <hr />

    <div class="section">
      <button id="save" class="btn-primary full-width">Lưu cấu hình</button>
    </div>

    <p id="status" role="status" class="main-status"></p>

    <script src="popup.js"></script>
  </body>
</html>
